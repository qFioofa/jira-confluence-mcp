  hints:
    session_email: "The email your team admin issued. This is the jira-web login, not necessarily your Atlassian account."
    session_password: "Your jira-web password. If you forgot it, ask your team admin to reset it."
    dashboard_active_team: "The active team determines the connections, projects, cache, and stats below. Switch teams on the Teams page."
    dashboard_projects: "Projects of the active team. Jira keys and Confluence spaces form the allowlist for MCP tools."
    dashboard_endpoints: "Personal URLs of your MCP endpoints. The token is only visible when it is created; this list shows the name, project, and last activity."
    teams_index: "A team groups members, connections, and projects. One team cannot see another team's data."
    team_show: "The slug is used in URLs and the team switcher. Members are users with access to this team's connections and projects."
    team_name: "The display name of the team. Visible only to members and admins."
    team_slug: "A short identifier for URLs and the team switcher: latin letters, digits, and hyphens. Example: backend-team."
    projects_index: "A project is an allowlist of Jira keys, Confluence spaces, and selected connections. One project can back one MCP endpoint per user."
    project_show: "A project ties Jira keys, Confluence spaces, and connections together. Jira keys and spaces form the allowlist; the server ignores everything else."
    project_cache: "Cache hits/misses are counted from project events. TTL and stale grace are configured in Cache strategies; Invalidate resets the generation."
    project_invalidate: "Invalidation bumps the project generation: old keys stop being used and new requests go to Jira/Confluence."
    project_calls: "They appear after MCP calls. Shows the tool, status, and duration."
    project_presets: "JQL/CQL presets for tools. They are created from seeds or the console; the list shows available my_work/sprint/review/blocked/recent/runbooks."
    project_endpoints: "Personal URLs for this project. The token is shown once at creation; the prefix here is only for recognition."
    project_endpoint_hint: "After creation, copy the /mcp/<token> URL: the token will not be shown again."
    project_name: "A human-readable project name. For example: Backend Platform."
    project_slug: "A short project identifier inside the team: latin letters, digits, and hyphens. Used as project_id in MCP."
    project_jira_connection: "The Jira site to read issues from. Create it first in the team's Connections section."
    project_confluence_connection: "The Confluence site for KB tools. Can be left empty if you do not need the knowledge base."
    project_jira_keys: "The Jira project key is the prefix of an issue number: CLD-123 → CLD. Separate multiple keys with commas. This is an allowlist: the server will not read other projects."
    project_spaces: "The Confluence space key. It is visible in a page URL: /spaces/CLD/pages/... → CLD. Separate multiple spaces with commas."
    project_style: "scrum or kanban affects my_work and sprint hints. It does not affect access rights."
    connections_index: "A connection is a Jira or Confluence site. The base URL comes from the browser address bar; status is updated after Verify or a health-check job."
    connection_provider: "Jira is for issues and sprints. Confluence is for the knowledge base. One site can have two connections: jira and confluence."
    connection_name: "A free-form label to tell sites apart. For example: Acme Jira Cloud or Internal Confluence."
    connection_base_url: "The site address from the browser address bar. Jira Cloud: https://company.atlassian.net. Confluence Cloud: https://company.atlassian.net/wiki. Data Center: the internal URL of your installation."
    connection_deployment: "cloud is Atlassian Cloud (*.atlassian.net). dc is self-hosted Jira/Confluence Data Center or Server. This affects the authentication method."
    credentials_index: "Each row is your personal account for a specific site. Verify makes a read-only request."
    credential_connection: "The site this personal account applies to. The list contains only connections of your teams."
    credential_auth_type: "api_token is Jira/Confluence Cloud (email + API token). pat is Data Center (personal access token)."
    credential_email: "The email of your Atlassian account for Cloud. It is visible in your Atlassian profile; for PAT/Data Center you can leave it empty."
    credential_secret: "Jira Cloud API token: id.atlassian.com → Security → API tokens (https://id.atlassian.com/manage-profile/security/api-tokens). Confluence Cloud uses the same token. Data Center PAT: Profile → Personal Access Tokens (Jira: /secure/ViewProfile.jspa, Confluence: /plugins/servlet/access-tokens)."
    credential_secret_note: "The secret is masked (last 4 characters). status and verified are updated after Verify or a health-check job; Verify only makes a read-only request."
    mcp_index: "An endpoint is created for your user and the selected project. The token is shown once after creation — keep the URL like a password. You can revoke it here."
    mcp_project: "The project defines the Jira keys and Confluence spaces allowlist. One endpoint equals one project."
    mcp_name: "A label for yourself: for example, opencode laptop or claude-desktop. It does not affect access."
    cache_index: "TTL is how many seconds data is considered fresh. Stale grace is how many seconds old data may be served if Jira/Confluence is temporarily unavailable. Changing a strategy resets the project cache."
    cache_ttl: "Data freshness in seconds. 60 = one minute; 3600 = one hour."
    cache_stale: "A time buffer when stale data may be served on a network error. 0 = never serve stale data."
    cache_enabled: "A disabled strategy turns off caching for the namespace."
  activerecord:
    errors:
      models:
        user_credential:
          attributes:
            connection:
              must_belong: "must belong to one of your teams"
