<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Как работает ruby-jira-mcp</title>
  <desc id="flowDesc">MCP-клиент общается с локальным сервером jira-cld по JSON-RPC через stdin и stdout. Сервер ограничивает запросы проектом CLD, делает только GET-запросы к Jira и Confluence и кэширует ответы в памяти и SQLite.</desc>

  <rect width="1200" height="360" rx="24" fill="#F5F7FA"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#D8E1EC"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5A6B80">
    <text x="64" y="48" letter-spacing="1.3">REQUEST PATH</text>
    <text x="1136" y="48" text-anchor="end" fill="#0E7C5A">READ-ONLY</text>
  </g>

  <g id="client" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="64" y="88" width="236" height="152" rx="14" fill="#FFFFFF" stroke="#D8E1EC"/>
    <text x="84" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.1" fill="#5A6B80">MCP CLIENT</text>
    <text x="84" y="154" font-size="26" font-weight="700" fill="#122033">opencode</text>
    <text x="84" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0B66C3">jira_get_issue</text>
    <text x="84" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5A6B80">CLD-142</text>
    <text x="84" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8A9AAF">tools/call</text>
  </g>

  <g id="stdio-link">
    <path d="M300 164 H358" stroke="#8A9AAF" stroke-width="2"/>
    <path d="M358 157 L370 164 L358 171 Z" fill="#8A9AAF"/>
    <text x="300" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A6B80">JSON-RPC</text>
  </g>

  <g id="server" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="390" y="72" width="330" height="192" rx="16" fill="#0B0F14" stroke="#26374D"/>
    <text x="414" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.1" fill="#8FA3BA">LOCAL SERVER</text>
    <text x="414" y="140" font-size="25" font-weight="700" fill="#F2F6FC">ruby-jira-mcp</text>
    <text x="414" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9FB0C6">MCP_PROJECT_ID=alpha</text>
    <rect x="414" y="178" width="282" height="32" rx="8" fill="#0B1320" stroke="#223145"/>
    <text x="430" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6CB6FF">project IN (CLD)</text>
    <text x="414" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6EE7B7">19 read-only tools</text>
  </g>

  <g id="cache" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M555 264 V278" stroke="#8A9AAF" stroke-width="1.5" stroke-dasharray="3 4"/>
    <rect x="390" y="282" width="330" height="44" rx="10" fill="#FFFFFF" stroke="#D8E1EC"/>
    <text x="414" y="310" font-size="19" fill="#122033">L1 memory + L2 SQLite</text>
    <text x="696" y="310" text-anchor="end" font-size="14" fill="#0E7C5A">local</text>
  </g>

  <g id="jira-request">
    <path d="M720 128 H776" stroke="#8A9AAF" stroke-width="2"/>
    <path d="M776 121 L788 128 L776 135 Z" fill="#8A9AAF"/>
    <text x="730" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#0E7C5A">GET</text>
  </g>

  <g id="confluence-request">
    <path d="M720 208 H776" stroke="#8A9AAF" stroke-width="2"/>
    <path d="M776 201 L788 208 L776 215 Z" fill="#8A9AAF"/>
    <text x="730" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#0E7C5A">GET</text>
  </g>

  <g id="sources" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="790" y="72" width="346" height="84" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/>
    <text x="812" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.1" fill="#0B66C3">JIRA</text>
    <text x="812" y="134" font-size="21" font-weight="600" fill="#122033">Cloud / Data Center</text>
    <text x="1112" y="102" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5A6B80">REST API</text>

    <rect x="790" y="180" width="346" height="84" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/>
    <text x="812" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.1" fill="#0E7C5A">CONFLUENCE</text>
    <text x="812" y="242" font-size="21" font-weight="600" fill="#122033">Search · page · children</text>
    <text x="1112" y="210" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5A6B80">REST API</text>
  </g>

  <text x="64" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5A6B80">NO WRITES · NO MESSAGE SENDING · SECRETS VIA token_ref</text>
</svg>
