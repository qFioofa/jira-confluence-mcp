name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: src

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: false
      - run: bundle config set --local without "ui"
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec rake test
      - run: bundle exec rake assets:verify

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec rake test
      - run: bundle exec rake assets:verify

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: false
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec rubocop
      - run: bundle exec bundler-audit check --update

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: false
      - run: bundle config set --local without "ui"
      - run: bundle install --jobs 4 --retry 3
      - run: gem build jira-cld.gemspec
      - run: docker build -f docker/Dockerfile --build-arg INSTALL_UI=false -t jira-cld:headless .
        working-directory: .
      - run: docker build -f docker/Dockerfile --build-arg INSTALL_UI=true -t jira-cld:full .
        working-directory: .
