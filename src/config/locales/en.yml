en:
  server:
    instructions: |
      Local read-only MCP server for Jira and Confluence. Project: %{project}.
      Every tool only reads data. JQL/CQL are always constrained by the project allowlist;
      project/space and ORDER BY in user queries are rejected. Never invent data: if a source is
      unavailable, return a partial result with warnings. Do not send messages or modify Jira/Confluence.
      Return links as links; never request binary attachment data.
  args:
    project_id: "Project id from project_list"
    include_query: "Include raw preset queries (debugging)"
    scope: "Issue scope: assigned, sprint, review, blocked, recent"
    jql: "JQL without project and ORDER BY; the server adds the allowlist and ordering"
    preset: "Preset id from project_describe.query_presets"
    cursor: "Opaque cursor from a previous next_cursor"
    key: "Issue key, e.g. CLD-123"
    kb_query: "Confluence search text; space and ordering are added server-side"
  tools:
    project_list:
      title: "Projects"
      description: "Project catalog: id, key, name, capabilities, space, aliases. Metadata only."
    project_describe:
      title: "Describe project"
      description: "Project metadata: issue types, boards, fields, presets, team. Does not change the project binding."
    project_resolve:
      title: "Resolve project"
      description: "Finds candidates by id/key/space/alias and returns needs_confirmation. Never binds a project."
    my_work:
      title: "My work"
      description: "Issues by preset id: assigned, sprint, review, blocked, recent. Includes why_now, next_action and blockers."
    search_issues:
      title: "Search issues"
      description: "Jira search by preset or JQL. Exactly one of jql/preset; project and ORDER BY are added server-side."
    get_issue:
      title: "Get issue"
      description: "Reads an issue; optionally comments, changelog and links."
    brief_issue:
      title: "Brief issue"
      description: "Collects issue, acceptance criteria, decisions, open questions, dependencies, similar issues and KB."
    get_changelog:
      title: "Changelog"
      description: "Issue changelog with cursor and limit."
    list_attachments:
      title: "Attachments"
      description: "Attachment metadata: name, size, mime, URL. No binary data."
    unblock_issue:
      title: "Unblock issue"
      description: "Finds prior art, experts, recent changes, runbooks, hypotheses and questions. Read-only."
    list_sprints:
      title: "Sprints"
      description: "Board sprints by board_id and state."
    get_sprint_issues:
      title: "Sprint issues"
      description: "Compact sprint issues with a cursor."
    kb_search:
      title: "Search KB"
      description: "Confluence search by query or CQL with an optional preset; space and ORDER BY are added server-side."
    kb_get_page:
      title: "Get KB page"
      description: "Reads a Confluence page by id or title+space and returns normalized text without macros."
    kb_list_children:
      title: "List children"
      description: "Confluence child pages with a cursor."
    team_who_knows:
      title: "Who knows"
      description: "Finds context holders by issue/topic/component/label and returns evidence, confidence and gaps."
    team_prepare_question:
      title: "Prepare question"
      description: "Builds 3-5 questions with reason and evidence. Sends nothing."
    whoami:
      title: "Who am I"
      description: "User, deployment, space and available capabilities."
    cache_stats:
      title: "Cache stats"
      description: "Hits/misses/bytes/evictions and aggregates for the last hour."
  resources:
    jira_issue:
      title: "Jira issue"
      description: "Jira issue as an addressable resource"
    kb_page:
      title: "Confluence page"
      description: "Knowledge base page as an addressable resource"
  prompts:
    daily:
      title: "Standup"
      description: "Issue summary: done, next, blockers"
      result: "Standup summary"
    release_notes:
      title: "Release notes"
      description: "Release notes by preset/JQL"
      result: "Release notes"
    task_brief:
      title: "Task brief"
      description: "Issue brief for understand/plan/verify"
      result: "Task brief"
    unblock:
      title: "Unblock"
      description: "Prior art, experts, hypotheses and questions"
      result: "Unblock analysis"
    handoff:
      title: "Handoff"
      description: "Handoff packet without sending messages"
      result: "Handoff packet"
    kb_answer:
      title: "KB answer"
      description: "Knowledge base answer with links"
      result: "KB answer"
  cli:
    ok: "ok"
