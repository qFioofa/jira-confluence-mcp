schema: 1

connections:
  jira:
    base_url: "https://jira.acme.internal"
    deployment: "dc"
    pat_ref: "env:JIRA_PAT"
  confluence:
    base_url: "https://confluence.acme.internal"
    pat_ref: "env:CONFLUENCE_PAT"

projects:
  alpha:
    name: "Alpha"
    jira_keys: ["CLD"]
    spaces: ["CLD"]
    style: "scrum"
    queries:
      jql:
        my_work:
          label: "Моя работа"
          query: "assignee = currentUser() AND statusCategory != Done"
          order_by: "updated DESC"
          default_limit: 20
        sprint:
          label: "Мой спринт"
          query: "assignee = currentUser() AND sprint in openSprints()"
          order_by: "updated DESC"
          default_limit: 20
      cql:
        runbooks:
          label: "Runbooks"
          query: "label = runbook AND type = page"
          order_by: "lastmodified DESC"
          default_limit: 10
    team:
      show_email: false

cross_scope:
  mode: "confirm"
  grant_ttl: 3600
  cache: false
