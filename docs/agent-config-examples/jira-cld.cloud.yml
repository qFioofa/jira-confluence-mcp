schema: 1

connections:
  jira:
    base_url: "https://acme.atlassian.net"
    deployment: "cloud"
    email: "dev@acme.io"
    token_ref: "env:JIRA_API_TOKEN"
  confluence:
    base_url: "https://acme.atlassian.net/wiki"
    token_ref: "env:JIRA_API_TOKEN"

projects:
  alpha:
    name: "Alpha"
    jira_keys: ["CLD"]
    spaces: ["CLD"]
    style: "scrum"
    queries:
      jql:
        my_work:
          label: "Моя работа"
          query: "assignee = currentUser() AND statusCategory != Done"
          order_by: "updated DESC"
          default_limit: 20
        blocked:
          label: "Заблокировано"
          query: "status = Blocked OR flagged = Impediment"
          order_by: "priority DESC"
          default_limit: 20
      cql:
        runbooks:
          label: "Runbooks"
          query: "label = runbook AND type = page"
          order_by: "lastmodified DESC"
          default_limit: 10
    team:
      show_email: false
  beta:
    name: "Beta"
    jira_keys: ["BET"]
    spaces: ["BET"]
    style: "kanban"
    queries:
      jql:
        recent:
          label: "Недавно обновлено"
          query: "assignee = currentUser() AND updated >= -7d"
          order_by: "updated DESC"
          default_limit: 20
      cql: {}

cross_scope:
  mode: "confirm"
  grant_ttl: 3600
  cache: false

ui:
  locale: "ru"
  theme: "system"
